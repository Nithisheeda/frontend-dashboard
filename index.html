<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TaskBoard — Dashboard</title>
<meta name="description" content="A self-contained, offline-capable task dashboard.">
<meta name="theme-color" content="#14161b">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark">◆</span>
        <span class="brand-name">TaskBoard</span>
      </div>
      <div id="weatherIndicator" class="weather-indicator" aria-live="polite">
        <span id="weatherIcon" class="weather-icon">🌡️</span>
        <span id="weatherText">Loading weather…</span>
      </div>
      <div id="streakIndicator" class="streak-indicator" title="Consecutive days with a completed task">
        <span class="streak-icon">🔥</span>
        <span id="streakCount">0</span>
      </div>
      <div class="settings-wrapper">
        <button id="settingsBtn" class="icon-btn" title="Export / Import" aria-label="Settings" aria-haspopup="true" aria-expanded="false">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6z"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        </button>
        <div id="settingsMenu" class="settings-menu" hidden>
          <button id="exportBtn" class="settings-menu-item" type="button">Export Tasks (JSON)</button>
          <button id="importBtn" class="settings-menu-item" type="button">Import Tasks (JSON)</button>
        </div>
      </div>
      <button id="themeToggle" class="icon-btn" title="Toggle theme" aria-label="Toggle theme">
        <svg id="iconMoon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
        <svg id="iconSun" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"></path></svg>
      </button>
      <input type="file" id="importFileInput" accept="application/json" hidden>
    </header>

    <main class="content">
      <section class="stats">
        <div class="stat-card">
          <span class="stat-value" id="statTotal">0</span>
          <span class="stat-label">Total</span>
        </div>
        <div class="stat-card">
          <span class="stat-value" id="statPending">0</span>
          <span class="stat-label">Pending</span>
        </div>
        <div class="stat-card">
          <span class="stat-value" id="statDone">0</span>
          <span class="stat-label">Completed</span>
        </div>
        <div class="stat-card">
          <span class="stat-value" id="statProgress">0%</span>
          <span class="stat-label">Progress</span>
          <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
        </div>
      </section>

      <section class="panel">
        <form id="taskForm" class="task-form">
          <input type="text" id="taskTitle" class="input" placeholder="Try: &quot;Review sports data tomorrow at 5 PM #work&quot;" autocomplete="off" required maxlength="120">
          <select id="taskPriority" class="input select">
            <option value="low">Low</option>
            <option value="medium" selected>Medium</option>
            <option value="high">High</option>
          </select>
          <select id="taskCategory" class="input select">
            <option value="personal" selected>Personal</option>
            <option value="work">Work</option>
            <option value="shopping">Shopping</option>
          </select>
          <input type="date" id="taskDue" class="input" aria-label="Due date">
          <button type="submit" class="btn btn-primary">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>
            Add Task
          </button>
        </form>
        <div id="smartHint" class="smart-hint" hidden></div>

        <div class="toolbar">
          <div class="filters" id="filters">
            <button class="chip active" data-filter="all">All</button>
            <button class="chip" data-filter="pending">Pending</button>
            <button class="chip" data-filter="completed">Completed</button>
          </div>
          <div class="toolbar-right">
            <input type="text" id="searchInput" class="input input-search" placeholder="Search tasks...">
            <button id="clearCompleted" class="btn btn-ghost">Clear completed</button>
          </div>
        </div>

        <ul id="taskList" class="task-list"></ul>

        <div id="emptyState" class="empty-state" hidden>
          <svg viewBox="0 0 24 24" width="40" height="40" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M9 11l3 3 8-8"></path><path d="M20 12v6a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h9"></path></svg>
          <p>No tasks match here. Add one above to get started.</p>
        </div>
      </section>
    </main>

    <footer class="footer">
      <span id="loadStatus">Loading mock data…</span>
      <span class="shortcut-hint">Shortcuts: N new task · J/K navigate · Esc clear</span>
    </footer>
  </div>

  <div id="toast" class="toast"></div>

  <div id="flashcard" class="flashcard" role="status" aria-live="polite">
    <span id="flashcardIcon" class="flashcard-icon">🎉</span>
    <div class="flashcard-body">
      <span id="flashcardText" class="flashcard-text"></span>
      <div class="flashcard-progress-track"><div id="flashcardProgress" class="flashcard-progress"></div></div>
    </div>
  </div>

  <script src="mockApi.js"></script>
  <script src="weather.js"></script>
  <script src="nlpParser.js"></script>
  <script src="script.js"></script>
</body>
</html>
