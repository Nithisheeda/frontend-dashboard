<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TaskBoard — Dashboard</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark">◆</span>
        <span class="brand-name">TaskBoard</span>
      </div>
      <button id="themeToggle" class="icon-btn" title="Toggle theme" aria-label="Toggle theme">
        <svg id="iconMoon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
        <svg id="iconSun" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"></path></svg>
      </button>
    </header>

    <main class="content">
      <section class="stats">
        <div class="stat-card">
          <span class="stat-value" id="statTotal">0</span>
          <span class="stat-label">Total</span>
        </div>
        <div class="stat-card">
          <span class="stat-value" id="statPending">0</span>
          <span class="stat-label">Pending</span>
        </div>
        <div class="stat-card">
          <span class="stat-value" id="statDone">0</span>
          <span class="stat-label">Completed</span>
        </div>
        <div class="stat-card">
          <span class="stat-value" id="statProgress">0%</span>
          <span class="stat-label">Progress</span>
          <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
        </div>
      </section>

      <section class="panel">
        <form id="taskForm" class="task-form">
          <input type="text" id="taskTitle" class="input" placeholder="What needs to be done?" autocomplete="off" required maxlength="120">
          <select id="taskPriority" class="input select">
            <option value="low">Low</option>
            <option value="medium" selected>Medium</option>
            <option value="high">High</option>
          </select>
          <input type="date" id="taskDue" class="input">
          <button type="submit" class="btn btn-primary">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>
            Add Task
          </button>
        </form>

        <div class="toolbar">
          <div class="filters" id="filters">
            <button class="chip active" data-filter="all">All</button>
            <button class="chip" data-filter="pending">Pending</button>
            <button class="chip" data-filter="completed">Completed</button>
          </div>
          <div class="toolbar-right">
            <input type="text" id="searchInput" class="input input-search" placeholder="Search tasks...">
            <button id="clearCompleted" class="btn btn-ghost">Clear completed</button>
          </div>
        </div>

        <ul id="taskList" class="task-list"></ul>

        <div id="emptyState" class="empty-state" hidden>
          <svg viewBox="0 0 24 24" width="40" height="40" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M9 11l3 3 8-8"></path><path d="M20 12v6a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h9"></path></svg>
          <p>No tasks match here. Add one above to get started.</p>
        </div>
      </section>
    </main>

    <footer class="footer">
      <span id="loadStatus">Loading mock data…</span>
    </footer>
  </div>

  <div id="toast" class="toast"></div>

  <script src="script.js"></script>
</body>
</html>
